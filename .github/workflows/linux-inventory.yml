name: Pinned Linux source inventory

on:
  pull_request:
    paths:
      - 'tools/linux_inventory.py'
      - 'tools/linux_uapi_tags.py'
      - 'tools/linux_uapi_ioctl_macros.py'
      - 'tools/linux_uapi_ioctl_numbers.py'
      - 'tools/linux_kconfig_relations.py'
      - 'tools/linux_kconfig_scoped.py'
      - 'tools/linux_kconfig_include_targets.py'
      - 'tools/linux_kconfig_root_closure.py'
      - 'tools/linux_kconfig_profile_matrix.py'
      - 'tools/linux_x86_syscall_matrix.py'
      - 'tools/linux_x86_ia32_syscall_matrix.py'
      - 'tests/test_linux_uapi_tags.py'
      - 'tests/test_linux_uapi_ioctl_macros.py'
      - 'tests/test_linux_uapi_ioctl_numbers.py'
      - 'tests/test_linux_kconfig_relations.py'
      - 'tests/test_linux_kconfig_scoped.py'
      - 'tests/test_linux_kconfig_include_targets.py'
      - 'tests/test_linux_kconfig_root_closure.py'
      - 'tests/test_linux_kconfig_profile_matrix.py'
      - 'tests/test_linux_x86_syscall_matrix.py'
      - 'tests/test_linux_x86_ia32_syscall_matrix.py'
      - 'tests/test_linux_inventory.py'
      - 'tests/test_device_table_spans.py'
      - 'docs/linux-inventory.md'
      - 'docs/linux-uapi-ioctl.md'
      - '.github/workflows/linux-inventory.yml'
  push:
    branches: [main]
    paths:
      - 'tools/linux_inventory.py'
      - 'tools/linux_uapi_tags.py'
      - 'tools/linux_uapi_ioctl_macros.py'
      - 'tools/linux_uapi_ioctl_numbers.py'
      - 'tools/linux_kconfig_relations.py'
      - 'tools/linux_kconfig_scoped.py'
      - 'tools/linux_kconfig_include_targets.py'
      - 'tools/linux_kconfig_root_closure.py'
      - 'tools/linux_kconfig_profile_matrix.py'
      - 'tools/linux_x86_syscall_matrix.py'
      - 'tools/linux_x86_ia32_syscall_matrix.py'
      - 'tests/test_linux_uapi_tags.py'
      - 'tests/test_linux_uapi_ioctl_macros.py'
      - 'tests/test_linux_uapi_ioctl_numbers.py'
      - 'tests/test_linux_kconfig_relations.py'
      - 'tests/test_linux_kconfig_scoped.py'
      - 'tests/test_linux_kconfig_include_targets.py'
      - 'tests/test_linux_kconfig_root_closure.py'
      - 'tests/test_linux_kconfig_profile_matrix.py'
      - 'tests/test_linux_x86_syscall_matrix.py'
      - 'tests/test_linux_x86_ia32_syscall_matrix.py'
      - 'tests/test_linux_inventory.py'
      - 'tests/test_device_table_spans.py'
      - 'docs/linux-inventory.md'
      - 'docs/linux-uapi-ioctl.md'
      - '.github/workflows/linux-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recursive-source-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout HeptaKernel candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Test inventory parser against adversarial Git fixtures
        run: |
          python3 -I -B tests/test_linux_inventory.py
          python3 -I -B tests/test_device_table_spans.py
          python3 -I -B tests/test_linux_uapi_tags.py
          python3 -I -B tests/test_linux_uapi_ioctl_macros.py
          python3 -I -B tests/test_linux_uapi_ioctl_numbers.py
          python3 -I -B tests/test_linux_kconfig_relations.py
          python3 -I -B tests/test_linux_kconfig_scoped.py
          python3 -I -B tests/test_linux_kconfig_include_targets.py
          python3 -I -B tests/test_linux_kconfig_root_closure.py
          python3 -I -B tests/test_linux_kconfig_profile_matrix.py
          python3 -I -B tests/test_linux_x86_syscall_matrix.py
          python3 -I -B tests/test_linux_x86_ia32_syscall_matrix.py

      - name: Checkout exact pinned upstream Linux (not a moving branch)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: gregkh/linux
          ref: 7595a62d45ee1a2297eafa5f2ef5d0a45142d84d
          fetch-depth: 1
          persist-credentials: false
          path: .upstream/linux

      - name: Extract all tracked paths and Kconfig lexical declarations
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .upstream/linux rev-parse HEAD)" = "7595a62d45ee1a2297eafa5f2ef5d0a45142d84d"
          python3 -I -B tools/linux_inventory.py \
            --repo .upstream/linux \
            --lock compatibility/linux-source-lock.json \
            --out build/linux-inventory

      - name: Bind native and x32 common-plus-special syscall source obligations
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B tools/linux_x86_syscall_matrix.py \
            --repo .upstream/linux --inventory build/linux-inventory \
            --lock compatibility/linux-source-lock.json \
            --vendor third_party/linux/arch/x86/entry/syscalls/syscall_64.tbl
          python3 - <<'PY'
          import base64, hashlib, json, subprocess
          from pathlib import Path
          root = Path("build/linux-inventory")
          out = json.loads((root/"syscall-x86-dual-report.json").read_bytes())
          abi = {
              "x86_64": [json.loads(x) for x in (root/"syscall-x86-native-obligations.jsonl").read_bytes().splitlines()],
              "x32": [json.loads(x) for x in (root/"syscall-x32-obligations.jsonl").read_bytes().splitlines()],
          }
          table_path = b"arch/x86/entry/syscalls/syscall_64.tbl"
          original = [json.loads(x) for x in (root/"syscall-table-rows.jsonl").read_bytes().splitlines()
                      if base64.b64decode(json.loads(x)["path_b64"]) == table_path]
          assert len(original) == 422 and out["counts"]["original_source_rows"] == 422
          assert out["status"] == "SOURCE_ONLY_NO_IMPLEMENTATION_OR_KCONFIG_EVALUATION"
          assert not out["inventory_complete"] and not out["full_rewrite_complete"]
          assert out["x32_dispatch_bit"] == 0x40000000
          paths = {base64.b64decode(x["path_b64"]): x for x in
                   map(json.loads, (root/"source-paths.jsonl").read_bytes().splitlines())}
          oid = paths[table_path]["oid"]
          blob = subprocess.check_output(["git","-C",".upstream/linux","cat-file","blob",oid])
          assert hashlib.sha256(blob).hexdigest() == out["source_blob_sha256"]
          vendor = Path("third_party/linux/arch/x86/entry/syscalls/syscall_64.tbl").read_bytes()
          assert out["vendor_status"] == "VENDORED_EXTRA_TRAILING_LF"
          assert blob.endswith(b"\n") and vendor == blob + b"\n"
          assert hashlib.sha256(vendor).hexdigest() == out["vendor_sha256"]
          assert out["source_blob_oid"] == oid
          assert out["linux_commit"] == subprocess.check_output(
              ["git","-C",".upstream/linux","rev-parse","HEAD"], text=True).strip()
          expected = {"x86_64": [], "x32": []}
          groups = {"64": 0, "common": 0, "x32": 0}
          for lineno, raw in enumerate(blob.split(b"\n"), 1):
              parts = raw.partition(b"#")[0].split()
              if not parts:
                  continue
              assert len(parts) in (3, 4, 6)
              number, source_abi, name = int(parts[0]), parts[1].decode(), parts[2].decode()
              assert source_abi in groups
              groups[source_abi] += 1
              handler = parts[3].decode() if len(parts) >= 4 else None
              for target in ("x86_64", "x32"):
                  if source_abi not in (("64","common") if target == "x86_64" else ("x32","common")):
                      continue
                  expected[target].append((lineno, raw, number, name, source_abi, handler,
                      number | (0 if target == "x86_64" else 0x40000000), len(parts) == 6))
          for target in expected:
              observed = [(
                  x["source_line"], base64.b64decode(x["source_raw_b64"]), x["source_number"],
                  x["name"], x["source_abi"], x["declared_entry"], x["dispatch_number"],
                  x["noreturn_declaration"]) for x in abi[target]]
              assert observed == expected[target]
              assert all(x["source_blob_oid"] == oid and
                         x["implementation_status"] == "NOT_IMPLEMENTED" and
                         x["entry_status"] == ("DECLARED_ENTRY_NOT_IMPLEMENTED"
                           if x["declared_entry"] else "NO_ENTRY_DECLARED") for x in abi[target])
              filename = "syscall-x86-native-obligations.jsonl" if target == "x86_64" else "syscall-x32-obligations.jsonl"
              key = "native_sha256" if target == "x86_64" else "x32_sha256"
              assert hashlib.sha256((root/filename).read_bytes()).hexdigest() == out[key]
          assert groups == {"common": 339, "64": 47, "x32": 36}
          assert len(abi["x86_64"]) == 386 and len(abi["x32"]) == 375
          assert len(expected["x32"]) == groups["common"] + groups["x32"]
          assert out["counts"]["native_dispatch_obligations"] == 386
          assert out["counts"]["x32_dispatch_obligations"] == 375
          assert all(out["counts"][k] == v for k, v in (
              ("common_rows", 339), ("native_only_rows", 47), ("x32_only_rows", 36)))
          print("X86_64_X32_SOURCE_PROJECTION: PASS", len(abi["x86_64"]), len(abi["x32"]))
          print("X86_64_X32_REAL_SYSCALL_IMPLEMENTATION: HOLD")
          PY

      - name: Bind pinned i386 and IA32_EMULATION syscall source obligations
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B tools/linux_x86_ia32_syscall_matrix.py \
            --repo .upstream/linux --inventory build/linux-inventory \
            --lock compatibility/linux-source-lock.json
          python3 - <<'PY'
          import base64, hashlib, json, subprocess
          from pathlib import Path
          root = Path("build/linux-inventory")
          report = json.loads((root/"syscall-ia32-report.json").read_bytes())
          raw = (root/"syscall-ia32-obligations.jsonl").read_bytes()
          observed = [json.loads(x) for x in raw.splitlines()]
          blob = subprocess.check_output(["git", "-C", ".upstream/linux", "show",
              "HEAD:arch/x86/entry/syscalls/syscall_32.tbl"])
          originals = []
          for line, source in enumerate(blob.split(bytes([10])), 1):
              cols = source.partition(b"#")[0].split()
              if not cols:
                  continue
              assert len(cols) in (3, 4, 5, 6)
              assert cols[1] == b"i386" and cols[0].isdigit()
              number = int(cols[0])
              primary = cols[3].decode() if len(cols) >= 4 else None
              compat = cols[4].decode() if len(cols) >= 5 and cols[4] != b"-" else None
              originals.append((line, source, number, cols[2].decode(), primary, compat,
                                bool(len(cols) == 6)))
          projected = [(
              x["source_line"], base64.b64decode(x["source_raw_b64"]),
              x["source_number"], x["name"], x["native_declared_entry"],
              x["compat_declared_entry"], x["noreturn_declaration"]) for x in observed]
          assert projected == originals and len(originals) == 462
          assert len({x[2] for x in projected}) == len(originals)
          assert report["counts"] == {
              "source_rows": 462,
              "missing_primary_entry": 19,
              "explicit_compat_overrides": 101,
              "noreturn_declarations": 2,
              "max_source_number": 472,
          }
          assert all(x["implementation_status"] == "NOT_IMPLEMENTED" for x in observed)
          assert all(x["entry_selection"] == (
              "EXPLICIT_COMPAT_OVERRIDE" if x["compat_declared_entry"] else
              "PRIMARY_DECLARATION" if x["native_declared_entry"] else
              "NO_DECLARED_ENTRY") for x in observed)
          assert hashlib.sha256(blob).hexdigest() == report["source_blob_sha256"]
          assert hashlib.sha256(raw).hexdigest() == report["ia32_sha256"]
          assert report["status"] == "SOURCE_ONLY_NO_IMPLEMENTATION_OR_KCONFIG_EVALUATION"
          assert not report["inventory_complete"] and not report["full_rewrite_complete"]
          print("IA32_COMPAT_SOURCE_PROJECTION: PASS", len(projected))
          print("IA32_REAL_SYSCALL_IMPLEMENTATION: HOLD")
          PY

      - name: Bind UAPI ioctl macro source spans without claiming ABI implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B tools/linux_uapi_ioctl_macros.py \
            --repo .upstream/linux --lock compatibility/linux-source-lock.json \
            --out build/linux-inventory
          python3 - <<'PY'
          import base64, hashlib, json, subprocess
          from pathlib import Path
          root = Path("build/linux-inventory")
          report = json.loads((root/"uapi-ioctl-report.json").read_text())
          data = (root/"uapi-ioctl-macro-obligations.jsonl").read_bytes()
          records = [json.loads(line) for line in data.splitlines()]
          assert report["source_sha256"] == hashlib.sha256(data).hexdigest()
          assert report["records"] == len(records) > 0
          assert report["counts"]["ioctl_macro_definitions"] == len(records)
          assert report["counts"]["ioctl_calls"] == sum(len(row["io_calls"]) for row in records)
          assert not report["inventory_complete"] and not report["full_rewrite_complete"]
          assert report["status"] == "PARTIAL_LEXICAL_NO_NUMBER_EVALUATION_OR_ABI_IMPLEMENTATION"
          commit = subprocess.check_output(["git", "-C", ".upstream/linux", "rev-parse", "HEAD"], text=True).strip()
          tree = subprocess.check_output(["git", "-C", ".upstream/linux", "rev-parse", "HEAD^{tree}"], text=True).strip()
          assert commit == report["linux_commit"] and tree == report["linux_root_tree"]
          paths = {base64.b64decode(row["path_b64"]): row for row in
                   map(json.loads, (root/"source-paths.jsonl").read_bytes().splitlines())}
          blobs = {}
          last_key = None
          for row in records:
              path = base64.b64decode(row["path_b64"])
              assert path.endswith(b".h") and b"/uapi/" in b"/" + path
              assert paths[path]["oid"] == row["blob_oid"]
              key = (path, row["start_byte"])
              assert last_key is None or key > last_key
              last_key = key
              if row["blob_oid"] not in blobs:
                  blobs[row["blob_oid"]] = subprocess.check_output(
                      ["git", "-C", ".upstream/linux", "cat-file", "blob", row["blob_oid"]])
              blob = blobs[row["blob_oid"]]
              original = base64.b64decode(row["raw_b64"])
              assert 0 <= row["start_byte"] < row["end_byte"] <= len(blob)
              assert blob[row["start_byte"]:row["end_byte"]] == original
              assert row["start_line"] >= 1 and row["end_line"] >= row["start_line"]
              assert row["io_calls"] and row["macro"]
              assert all(name in ("_IO", "_IOR", "_IOW", "_IOWR", "_IOC",
                                  "_IOR_BAD", "_IOW_BAD", "_IOWR_BAD", "_IOC_BAD", "_IO_BAD")
                         for name in row["io_calls"])
          print("UAPI_IOCTL_SOURCE_SPANS: PASS", len(records))
          print("UAPI_IOCTL_REAL_ABI_IMPLEMENTATION: HOLD")
          PY

      - name: Project strict x86-64 _IOC numeric source candidates and retain all unresolved calls
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B tools/linux_uapi_ioctl_numbers.py --inventory build/linux-inventory
          python3 - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          folder = Path("build/linux-inventory")
          source = (folder / "uapi-ioctl-macro-obligations.jsonl").read_bytes()
          parent = json.loads((folder / "uapi-ioctl-report.json").read_bytes())
          blob = (folder / "uapi-ioctl-x86_64-candidates.jsonl").read_bytes()
          report = json.loads((folder / "uapi-ioctl-x86_64-report.json").read_bytes())
          rows = [json.loads(x) for x in source.splitlines()]
          candidates = [json.loads(x) for x in blob.splitlines()]
          assert report["parent_source_sha256"] == parent["source_sha256"] == hashlib.sha256(source).hexdigest()
          assert report["projection_sha256"] == hashlib.sha256(blob).hexdigest()
          assert report["linux_commit"] == parent["linux_commit"]
          assert report["linux_root_tree"] == parent["linux_root_tree"]
          assert report["source_rows"] == len(rows) == parent["records"]
          assert report["invocations"] == len(candidates) == parent["counts"]["ioctl_calls"]
          assert sum(report["counts"].values()) == len(candidates)
          assert not report["inventory_complete"] and not report["full_rewrite_complete"]
          cursor = 0
          for row in rows:
              for ordinal, name in enumerate(row["io_calls"]):
                  candidate = candidates[cursor]
                  cursor += 1
                  assert candidate["path_b64"] == row["path_b64"]
                  assert candidate["blob_oid"] == row["blob_oid"]
                  assert candidate["source_start_byte"] == row["start_byte"]
                  assert candidate["source_end_byte"] == row["end_byte"]
                  assert candidate["ordinal"] == ordinal and candidate["call"] == name
                  assert candidate["preprocessor_reachability_verified"] is False
                  assert candidate["linux_ioctl_implementation_verified"] is False
                  raw = base64.b64decode(row["raw_b64"])
                  at = candidate["source_call_byte"] - row["start_byte"]
                  assert raw[at:at+len(name)] == name.encode("ascii")
                  number = candidate["number"]
                  if number is not None:
                      assert candidate["status"] == "X86_64_GENERIC_NUMERIC_CANDIDATE"
                      assert 0 <= number < 2**32
                  else:
                      assert candidate["status"] != "X86_64_GENERIC_NUMERIC_CANDIDATE"
          assert cursor == len(candidates)
          print("UAPI_IOCTL_X86_64_INDEPENDENT_REBIND: PASS", cursor)
          print("UAPI_IOCTL_REAL_ABI_IMPLEMENTATION: HOLD")
          PY

      - name: Inventory immutable UAPI C tag mentions (lexical, not ABI closure)
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B tools/linux_uapi_tags.py --repo .upstream/linux --lock compatibility/linux-source-lock.json --out build/linux-inventory
          python3 - <<'PY'
          import base64, hashlib, json, subprocess
          from pathlib import Path
          report = json.loads(Path("build/linux-inventory/uapi-tag-report.json").read_text())
          source = Path("build/linux-inventory/uapi-tag-mentions.jsonl").read_bytes()
          assert hashlib.sha256(source).hexdigest() == report["source_sha256"]
          assert report["records"] == len(source.splitlines()) and report["records"] > 0
          assert not report["inventory_complete"] and not report["full_rewrite_complete"]
          assert report["linux_commit"] == subprocess.check_output(["git","-C",".upstream/linux","rev-parse","HEAD"],text=True).strip()
          assert report["linux_root_tree"] == subprocess.check_output(["git","-C",".upstream/linux","rev-parse","HEAD^{tree}"],text=True).strip()
          assert report["schema"] == "heptakernel.linux-uapi-tag-lexical.v2"
          paths = set()
          blobs = {}
          for raw in source.splitlines():
              row = json.loads(raw)
              path = base64.b64decode(row["path_b64"])
              paths.add(path)
              assert path.endswith(b".h") and b"/uapi/" in b"/" + path
              assert row["tag"] in ("struct","union","enum")
              assert row["byte_at"] >= 0 and row["line"] >= 1
              oid = row["blob_oid"]
              assert len(oid) == 40
              if oid not in blobs:
                  blobs[oid] = subprocess.check_output(
                      ["git", "-C", ".upstream/linux", "cat-file", "blob", oid])
              physical_blob = blobs[oid]
              at = row["byte_at"]
              assert physical_blob[:at].count(b"\n") + 1 == row["line"]
              for start, span, token in (
                  (at, row["raw_span"], row["tag"].encode("ascii")),
                  (row["name_byte_at"], row["name_raw_span"],
                   base64.b64decode(row["name_b64"]) if row["name_b64"] else None)):
                  if token is None:
                      assert start is None and span is None
                      continue
                  assert isinstance(start, int) and isinstance(span, int)
                  assert 0 <= start < len(physical_blob) and span >= len(token)
                  assert start + span <= len(physical_blob)
                  physical_token = physical_blob[start:start + span]
                  assert physical_token.replace(b"\\\r\n", b"").replace(
                      b"\\\n", b"") == token
          assert paths
          print("UAPI_TAG_PHYSICAL_ORIGIN: PASS", report["records"], len(blobs))
          print("UAPI_TAG_LEXICAL_MANIFEST: PASS", report["records"], len(paths))
          print("FULL_LINUX_REWRITE: HOLD")
          PY

      - name: Inventory Kconfig relation lines with independent source-byte readback
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B tools/linux_kconfig_relations.py --repo .upstream/linux --lock compatibility/linux-source-lock.json --out build/linux-inventory
          python3 - <<'PY'
          import base64, hashlib, json, subprocess
          from pathlib import Path
          root = Path("build/linux-inventory")
          report = json.loads((root / "kconfig-relation-report.json").read_text())
          source = (root / "kconfig-relation-lines.jsonl").read_bytes()
          commit = json.loads(Path("compatibility/linux-source-lock.json").read_text())["linux"]["commit"]
          run = lambda *a: subprocess.check_output(["git", "-C", ".upstream/linux", *a])
          assert report["linux_commit"] == run("rev-parse", "HEAD").strip().decode() == commit
          assert report["linux_root_tree"] == run("rev-parse", "HEAD^{tree}").strip().decode()
          assert hashlib.sha256(source).hexdigest() == report["source_sha256"]
          assert report["status"] == "PARTIAL_LEXICAL_RELATIONS_NOT_RESOLVED_GRAPH"
          assert report["inventory_complete"] is False and report["full_rewrite_complete"] is False
          rows = [json.loads(line) for line in source.splitlines()]
          assert len(rows) == report["counts"]["relation_line_candidates"] > 0
          paths = [json.loads(line) for line in (root / "source-paths.jsonl").read_bytes().splitlines()]
          ref = []
          counter = {"kconfig_paths": 0, "unreadable_kconfig_paths": 0,
                     "scanned_kconfig_paths": 0}
          single = {b"select", b"imply", b"default", b"range", b"prompt",
                    b"def_bool", b"def_tristate"}
          for item in paths:
              name = base64.b64decode(item["path_b64"])
              leaf = name.split(b"/")[-1]
              if leaf != b"Kconfig" and not leaf.startswith(b"Kconfig."):
                  continue
              counter["kconfig_paths"] += 1
              if item["mode"] not in ("100644", "100755") or item["type"] != "blob":
                  counter["unreadable_kconfig_paths"] += 1
                  continue
              counter["scanned_kconfig_paths"] += 1
              blob = run("cat-file", "blob", item["oid"])
              assert len(blob) == item["size"]
              offset = 0
              for number, raw in enumerate(blob.split(b"\n"), 1):
                  trimmed = raw.lstrip(b" \t")
                  words = trimmed.split(None, 2)
                  kind, operand = None, None
                  if len(words) >= 3 and words[0:2] == [b"depends", b"on"]:
                      kind, operand = b"depends_on", words[2]
                  elif len(words) >= 3 and words[0:2] == [b"visible", b"if"]:
                      kind, operand = b"visible_if", words[2]
                  elif len(words) >= 2 and words[0] in single:
                      kind, operand = words[0], trimmed.split(None, 1)[1]
                  if kind is not None and operand is not None and operand[:1] not in (b" ", b"\t", b"\r"):
                      ref.append((name, item["oid"], number,
                                  offset + len(raw) - len(trimmed),
                                  offset + len(raw), kind, raw, operand))
                  offset += len(raw) + 1
          actual = [(base64.b64decode(x["path_b64"]), x["blob_oid"], x["line"],
                     x["byte_at"], x["byte_end"], x["kind"].encode(),
                     base64.b64decode(x["raw_b64"]),
                     base64.b64decode(x["operand_b64"])) for x in rows]
          assert [(a,b,c,d,e,f,g) for a,b,c,d,e,f,g,h in actual] == [
              (a,b,c,d,e,f,g) for a,b,c,d,e,f,g,h in ref]
          assert all(x[7] == y[7] for x,y in zip(actual,ref))
          for key, count in counter.items():
              assert report["counts"].get(key, 0) == count
          print("KCONFIG_RELATION_ORIGINAL_GIT_BYTES: PASS", len(ref))
          print("KCONFIG_SEMANTIC_DEPENDENCY_GRAPH: HOLD")
