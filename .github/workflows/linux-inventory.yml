          allowed_context = {
              "DIRECTIVE_LEXICAL_CANDIDATE",
              "HELP_TEXT_LEXICAL_ONLY",
              "UNRESOLVED_PHYSICAL_CONTINUATION",
              "UNRESOLVED_MIXED_HELP_INDENTATION",
          }
          assert set(report["context_counts"]) <= allowed_context
          blobs = {}
          for original, row in zip(old, now):
              assert all(row[k] == value for k, value in original.items()), (original, row)
              path = base64.b64decode(row["path_b64"])
              src = paths[path]
              assert src["oid"] == row["blob_oid"]
              oid = src["oid"]
              if oid not in blobs:
                  blobs[oid] = subprocess.check_output(
                      ["git", "-C", ".upstream/linux", "cat-file", "blob", oid]).splitlines()
              physical = blobs[oid][row["line"] - 1].lstrip(b" \t")
              kind, separator, operand = physical.partition(b" ")
              if separator:
                  operand = operand.strip(b" \t")
              else:
                  kind, separator, operand = physical.partition(b"\t")
                  operand = operand.strip(b" \t")
              assert kind.decode() == row["kind"]
              assert operand == base64.b64decode(row["operand_b64"])
              context = row["source_context"]
              assert context in allowed_context
              original_lines = blobs[oid]
              if context == "UNRESOLVED_PHYSICAL_CONTINUATION":
                  assert row["line"] > 1
                  assert original_lines[row["line"] - 2].rstrip(b"\r").endswith(b"\\")
              if context == "HELP_TEXT_LEXICAL_ONLY":
                  # Independent necessary condition using immutable blob bytes.
                  import re
                  line = original_lines[row["line"] - 1]
                  margin = line[:len(line) - len(line.lstrip(b" \t"))]
                  width = len(margin.expandtabs(8))
                  assert any(
                      re.fullmatch(rb"[ \t]*(?:help|---help---)[ \t]*\r?", candidate)
                      and len(candidate[:len(candidate) - len(candidate.lstrip(b" \t"))].expandtabs(8)) < width
                      for candidate in original_lines[:row["line"] - 1]
                  )
              dest = row["target_path_b64"]
              if dest is not None:
                  name = base64.b64decode(dest)
                  ref = paths.get(name)
                  if row["target_oid"] is None:
                      assert ref is None
                      assert row["resolution"] in (
                          "OPTIONAL_UNTRACKED_LITERAL", "REQUIRED_UNTRACKED_LITERAL")
                      assert row["target_mode"] is None
                  else:
                      assert ref is not None and row["target_oid"] == ref["oid"]
                      assert row["target_mode"] == ref["mode"]
                      if row["resolution"] == "TRACKED_REGULAR_LITERAL":
                          assert ref["mode"] in ("100644", "100755") and ref["type"] == "blob"
                      else:
                          assert row["resolution"] == "TRACKED_NONREGULAR_LITERAL"
              else:
                  assert row["target_oid"] is None and row["target_mode"] is None
                  assert row["resolution"] in (
                      "UNRESOLVED_LITERAL_SYNTAX", "UNRESOLVED_VARIABLE_GLOB_OR_ESCAPE",
                      "OUTSIDE_TRACKED_TREE")
          assert sum(v for k,v in report["counts"].items() if k != "all_lexical_edges") == len(now)
          print("KCONFIG_LITERAL_TARGET_GIT_PROVENANCE: PASS", len(now), report["counts"])
          print("KCONFIG_ACTIVE_DEPENDENCY_GRAPH: HOLD")
          print("FULL_LINUX_REWRITE: HOLD")
          PY

      - name: Traverse explicitly profiled, possible Kconfig root inclusions
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B tools/linux_kconfig_root_closure.py \
            --repo .upstream/linux --inventory build/linux-inventory \
            --srcarch x86 --header-arch x86
          python3 - <<'PY'
          import base64, hashlib, json, subprocess
          from pathlib import Path
          root = Path("build/linux-inventory")
          report = json.loads((root / "kconfig-profile-root-report.json").read_bytes())
          raw = (root / "kconfig-literal-targets.jsonl").read_bytes()
          out = (root / "kconfig-profile-root-edges.jsonl").read_bytes()
          files = (root / "kconfig-profile-root-files.jsonl").read_bytes()
          assert report["schema"] == "heptakernel.linux-kconfig-profiled-root.v1"
          assert report["status"] == "PARTIAL_POSSIBLE_ROOT_GRAPH_NOT_EVALUATED_KCONFIG"
          assert report["profile"] == {"SRCARCH": "x86", "HEADER_ARCH": "x86"}
          assert report["source_literal_sha256"] == hashlib.sha256(raw).hexdigest()
          assert report["profile_edges_sha256"] == hashlib.sha256(out).hexdigest()
          assert report["reachable_files_sha256"] == hashlib.sha256(files).hexdigest()
          assert not report["inventory_complete"] and not report["full_rewrite_complete"]
          before = list(map(json.loads, raw.splitlines()))
          after = list(map(json.loads, out.splitlines()))
          assert len(before) == len(after) == report["counts"]["all_lexical_edges"]
          assert all(all(r[k] == v for k,v in o.items()) for o,r in zip(before,after))
          root_paths = {base64.b64decode(x["path_b64"]): x
                        for x in map(json.loads, (root / "source-paths.jsonl").read_bytes().splitlines())}
          seen = {}
          for f in map(json.loads, files.splitlines()):
              p = base64.b64decode(f["path_b64"])
              assert p in root_paths and root_paths[p]["oid"] == f["oid"]
              assert root_paths[p]["mode"] in ("100644", "100755")
              assert p not in seen and f["depth"] >= 0
              seen[p] = f
          assert b"Kconfig" in seen and seen[b"Kconfig"]["depth"] == 0
          assert len(seen) == report["counts"]["reachable_regular_files"]
          assert seen
          for r in after:
              source = base64.b64decode(r["path_b64"])
              if r["root_route"] == "SOURCE_NOT_REACHED":
                  assert source not in seen and r["root_parent_depth"] is None
              elif r["root_route"] == "NON_DIRECTIVE_CONTEXT":
                  assert source in seen and r["source_context"] != "DIRECTIVE_LEXICAL_CANDIDATE"
              elif r["root_route"] == "FOLLOWED_TRACKED_FILE":
                  assert source in seen and r["profile_resolution"] == "TRACKED_REGULAR_LITERAL"
                  target = base64.b64decode(r["profile_target_path_b64"])
                  assert target in seen and seen[target]["depth"] <= seen[source]["depth"]+1
              else:
                  assert r["root_route"] == "REACHED_UNRESOLVED_OR_UNFOLLOWABLE"
                  assert source in seen and r["profile_resolution"] != "TRACKED_REGULAR_LITERAL"
          # Independent traversal oracle: reconstruct BFS from the retained,
          # source-bound edge rows, without relying on the generated depth list.
          import collections, posixpath, re
          adj = collections.defaultdict(list)
          variable = re.compile(rb"\$\((SRCARCH|HEADER_ARCH)\)|\$\{(SRCARCH|HEADER_ARCH)\}|\$(SRCARCH|HEADER_ARCH)\b")
          for r in after:
              source = base64.b64decode(r["path_b64"])
              if r["root_route"] != "FOLLOWED_TRACKED_FILE":
                  continue
              operand = base64.b64decode(r["operand_b64"])
              original = operand
              def expand_token(m):
                  key = next(g for g in m.groups() if g is not None)
                  assert key in (b"SRCARCH", b"HEADER_ARCH")
                  return b"x86"
              operand = variable.sub(expand_token, operand)
              assert r["profile_source"] == (
                  "EXPLICIT_VARIABLE_BINDING" if operand != original else "ORIGINAL_LITERAL")
              if operand.startswith(b'"'):
                  assert operand.endswith(b'"')
                  target_part = operand[1:-1]
              else:
                  target_part = operand
              assert target_part and not any(x in target_part for x in b"$*?[]\\#'\"")
              anchor = posixpath.dirname(source) if r["kind"] in ("rsource","orsource") else b""
              target = posixpath.normpath(posixpath.join(anchor, target_part))
              assert target == base64.b64decode(r["profile_target_path_b64"])
              assert root_paths[target]["mode"] in ("100644", "100755")
              assert root_paths[target]["oid"] == r["profile_target_oid"]
              adj[source].append(target)
          computed = {b"Kconfig": 0}
          pending = collections.deque([b"Kconfig"])
          while pending:
              current = pending.popleft()
              for child in adj[current]:
                  if child not in computed:
                      computed[child] = computed[current] + 1
                      pending.append(child)
          assert computed == {p: item["depth"] for p,item in seen.items()}
          assert report["linux_commit"] == subprocess.check_output(
              ["git","-C",".upstream/linux","rev-parse","HEAD"],text=True).strip()
          print("KCONFIG_PROFILED_ROOT_GIT_CLOSURE: PASS",len(seen),len(after))
          print("KCONFIG_ACTIVE_GRAPH_AND_FULL_REWRITE: HOLD")
          PY

