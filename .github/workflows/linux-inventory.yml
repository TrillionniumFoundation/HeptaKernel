name: Pinned Linux source inventory

on:
  pull_request:
    paths:
      - 'tools/linux_inventory.py'
      - 'tests/test_linux_inventory.py'
      - 'docs/linux-inventory.md'
      - '.github/workflows/linux-inventory.yml'
  push:
    branches: [main]
    paths:
      - 'tools/linux_inventory.py'
      - 'tests/test_linux_inventory.py'
      - 'docs/linux-inventory.md'
      - '.github/workflows/linux-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recursive-source-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout HeptaKernel candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Test inventory parser against adversarial Git fixtures
        run: python3 -I -B tests/test_linux_inventory.py

      - name: Checkout exact pinned upstream Linux (not a moving branch)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: gregkh/linux
          ref: 7595a62d45ee1a2297eafa5f2ef5d0a45142d84d
          fetch-depth: 1
          persist-credentials: false
          path: .upstream/linux

      - name: Extract all tracked paths and Kconfig lexical declarations
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .upstream/linux rev-parse HEAD)" = "7595a62d45ee1a2297eafa5f2ef5d0a45142d84d"
          python3 -I -B tools/linux_inventory.py \
            --repo .upstream/linux \
            --lock compatibility/linux-source-lock.json \
            --out build/linux-inventory

      - name: Independently check source counts, hashes and unclosed Linux scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, subprocess
          from pathlib import Path
          root = Path("build/linux-inventory")
          report = json.loads((root / "report.json").read_text())
          commit = json.loads(Path("compatibility/linux-source-lock.json").read_text())["linux"]["commit"]
          assert report["linux_commit"] == commit
          assert report["linux_root_tree"] == subprocess.check_output([
              "git", "-C", ".upstream/linux", "rev-parse", "HEAD^{tree}"
          ], text=True).strip()
          assert report["status"] == "PARTIAL_SOURCE_INVENTORY_NOT_LINUX_IMPLEMENTATION"
          assert report["inventory_complete"] is False
          assert report["linux_full_rewrite_complete"] is False
          source = (root / report["source_paths_file"]).read_bytes()
          kconfig = (root / report["kconfig_declarations_file"]).read_bytes()
          source_edges = (root / report["kconfig_source_edges_file"]).read_bytes()
          directories = (root / report["directory_objects_file"]).read_bytes()
          uapi = (root / report["uapi_entries_file"]).read_bytes()
          assert hashlib.sha256(source).hexdigest() == report["source_paths_sha256"]
          assert hashlib.sha256(kconfig).hexdigest() == report["kconfig_declarations_sha256"]
          assert hashlib.sha256(source_edges).hexdigest() == report["kconfig_source_edges_sha256"]
          assert hashlib.sha256(directories).hexdigest() == report["directory_objects_sha256"]
          assert hashlib.sha256(uapi).hexdigest() == report["uapi_entries_sha256"]
          rows = [json.loads(x) for x in source.splitlines()]
          paths = [base64.b64decode(x["path_b64"]) for x in rows]
          actual = subprocess.check_output([
              "git", "-C", ".upstream/linux", "ls-tree", "--full-tree",
              "-r", "-z", "--name-only", commit
          ]).rstrip(b"\0").split(b"\0")
          assert len(rows) == len(actual) == report["counts"]["tracked_paths"]
          assert set(paths) == set(actual)
          assert paths == sorted(paths)
          assert len(paths) == len(set(paths))
          directory_rows = [json.loads(x) for x in directories.splitlines()]
          uapi_rows = [json.loads(x) for x in uapi.splitlines()]
          ref_tree = subprocess.check_output([
              "git", "-C", ".upstream/linux", "ls-tree",
              "-r", "-t", "-z", "--full-tree", commit
          ])
          ref_directories = {}
          for entry in ref_tree.split(b"\x00"):
              if not entry:
                  continue
              metadata, path = entry.split(b"\t", 1)
              mode, kind, oid = metadata.split()
              if kind == b"tree":
                  assert mode == b"040000"
                  ref_directories[path] = oid.decode("ascii")
          assert {base64.b64decode(x["path_b64"]): x["oid"]
                  for x in directory_rows} == ref_directories
          assert len(directory_rows) == report["counts"]["directory_tree_objects"]
          by_path = {base64.b64decode(x["path_b64"]): x for x in rows}
          assert len(uapi_rows) == report["counts"]["uapi_tree_entries"]
          for uapi_record in uapi_rows:
              assert by_path[base64.b64decode(uapi_record["path_b64"])] == uapi_record
          assert report["counts"]["kconfig_declarations"] > 0
          edges = [json.loads(x) for x in source_edges.splitlines()]
          assert len(edges) == report["counts"]["kconfig_source_edges"]
          source_kinds = ("source", "rsource", "osource", "orsource")
          valid_blob_ids = {p["oid"] for p in rows}
          assert all(e["kind"] in source_kinds and e["line"] >= 1 and
                     e["blob_oid"] in valid_blob_ids and
                     base64.b64decode(e["operand_b64"]) for e in edges)
          assert sum(report["counts"]["kconfig_source_" + kind]
                     for kind in source_kinds) == len(edges)
          print("FULL_GIT_TREE_LOSSLESS_INVENTORY: PASS", len(rows))
          print("KCONFIG_DECLARATION_RECORDS:", report["counts"]["kconfig_declarations"])
          print("KCONFIG_SOURCE_EDGES:", report["counts"]["kconfig_source_edges"])
          print("FULL_LINUX_REWRITE: HOLD")
          PY
          set +e
          python3 tools/check_closure.py > build/linux-inventory/closure-state.json
          result=$?
          set -e
          test "$result" -eq 2
          cat build/linux-inventory/closure-state.json

      - name: Retain pinned, replayable inventory as an artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pinned-linux-source-inventory-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            build/linux-inventory/source-paths.jsonl
            build/linux-inventory/kconfig-declarations.jsonl
            build/linux-inventory/kconfig-source-edges.jsonl
            build/linux-inventory/directory-objects.jsonl
            build/linux-inventory/uapi-paths.jsonl
            build/linux-inventory/report.json
            build/linux-inventory/closure-state.json
