              assert ref["mode"] in ("100644", "100755")
              blob = subprocess.check_output([
                  "git", "-C", ".upstream/linux", "cat-file", "blob", ref["oid"]
              ])
              assert len(blob) == ref["size"]
              for number, line in enumerate(blob.split(b"\n"), 1):
                  if not re.search(rb"MODULE_DEVICE_TABLE[ \t]*\(", line):
                      continue
                  match = re.search(
                      rb"MODULE_DEVICE_TABLE[ \t]*\([ \t]*([A-Za-z_][A-Za-z_0-9]*)"
                      rb"[ \t]*,[ \t]*([A-Za-z_][A-Za-z_0-9]*)[ \t]*\)",
                      line)
                  expected_device.append((path, ref["oid"], number, line,
                      "LEXICAL_ARGUMENTS" if match else "UNPARSED",
                      match.group(1) if match else None,
                      match.group(2) if match else None))
          actual_device = [(base64.b64decode(x["path_b64"]), x["blob_oid"],
                            x["line"], base64.b64decode(x["raw_b64"]), x["status"],
                            base64.b64decode(x["bus_b64"]) if x["bus_b64"] else None,
                            base64.b64decode(x["symbol_b64"]) if x["symbol_b64"] else None)
                           for x in map(json.loads, device_tables.splitlines())]
          assert actual_device == sorted(expected_device, key=lambda x: (x[0], x[2])), (
              "missing/reordered/modified pinned driver macro source rows")
          assert report["counts"]["module_device_table_mentions"] == len(actual_device)
          assert report["counts"]["module_device_table_unparsed"] == sum(
              x[4] == "UNPARSED" for x in actual_device)
          # Independently reconstruct each bounded call from the original Git
          # blobs. This deliberately does not import the extractor's regex.
          expected_spans = []
          word = b"MODULE_DEVICE_TABLE"
          allowed_space = b" \t\r\n"
          import re
          for tagged in filter(None, listing.stdout.split(b"\x00")):
              assert tagged.startswith(commit.encode("ascii") + b":")
              path = tagged[41:]
              ref = by_path[path]
              blob = subprocess.check_output([
                  "git", "-C", ".upstream/linux", "cat-file", "blob", ref["oid"]
              ])
              assert len(blob) == ref["size"]
              position = 0
              while True:
                  start = blob.find(word, position)
                  if start < 0:
                      break
                  position = start + len(word)
                  open_at = position
                  while open_at < len(blob) and blob[open_at] in allowed_space:
                      open_at += 1
                  if open_at >= len(blob) or blob[open_at] != 40:
                      continue
                  scan_end = min(len(blob), open_at + 1 + 4096)
                  close = blob.find(b")", open_at + 1, scan_end)
                  end = close + 1 if close >= 0 else scan_end
                  raw = blob[start:end]
                  tokens = raw[open_at - start + 1:-1].split(b",") if close >= 0 else []
                  identifiers = [token.strip(allowed_space) for token in tokens]
                  is_ident = lambda token: re.fullmatch(
                      rb"[A-Za-z_][A-Za-z_0-9]*", token) is not None
                  parseable = len(identifiers) == 2 and all(
                      is_ident(token) for token in identifiers)
                  status = ("TRUNCATED" if close < 0 else
                            "LEXICAL_ARGUMENTS" if parseable else "UNPARSED")
                  expected_spans.append((
                      path, ref["oid"], start, end,
                      blob.count(b"\n", 0, start) + 1,
                      blob.count(b"\n", 0, end - 1) + 1,
                      raw, status,
                      identifiers[0] if parseable else None,
                      identifiers[1] if parseable else None,
                  ))
          expected_spans.sort(key=lambda x: (x[0], x[2]))
          actual_spans = []
          for row in map(json.loads, invocation_bytes.splitlines()):
              actual_spans.append((
                  base64.b64decode(row["path_b64"]), row["blob_oid"],
                  row["start_byte"], row["end_byte"],
                  row["start_line"], row["end_line"],
                  base64.b64decode(row["raw_b64"]), row["status"],
                  base64.b64decode(row["bus_b64"]) if row["bus_b64"] else None,
                  base64.b64decode(row["symbol_b64"]) if row["symbol_b64"] else None,
              ))
          assert actual_spans == expected_spans, (
              "missing, forged or reordered pinned multiline device table spans")
          assert len(actual_spans) == report["counts"]["module_device_table_invocations"]
          assert sum(row[5] > row[4] for row in actual_spans) == (
              report["counts"]["module_device_table_multiline"])
          assert sum(row[7] != "LEXICAL_ARGUMENTS" for row in actual_spans) == (
              report["counts"]["module_device_table_invocations_unparsed"])
          print("MODULE_DEVICE_TABLE_POSITION_BOUND_SPANS:", len(actual_spans))
          print("MODULE_DEVICE_TABLE_LEXICAL_ROWS:", len(actual_device))
          print("UAPI_MACRO_SOURCE_ROWS:", len(actual_macros))
          print("UNPARSED_SYSCALL_ROWS:", unparsed_syscalls)
          print("FULL_LINUX_REWRITE: HOLD")
          PY
          set +e
          python3 tools/check_closure.py > build/linux-inventory/closure-state.json
          result=$?
          set -e
          test "$result" -eq 2
          cat build/linux-inventory/closure-state.json

      - name: Bind lexical root inclusions across every pinned architecture directory
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B tools/linux_kconfig_profile_matrix.py \
            --repo .upstream/linux --inventory build/linux-inventory \
            --lock compatibility/linux-source-lock.json
          python3 - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          root = Path("build/linux-inventory")
          lock = json.loads(Path("compatibility/linux-source-lock.json").read_bytes())
          report = json.loads((root / "kconfig-arch-matrix-report.json").read_bytes())
          raw = (root / "kconfig-arch-matrix-memberships.jsonl").read_bytes()
          union = (root / "kconfig-arch-matrix-union.jsonl").read_bytes()
          records = list(map(json.loads, raw.splitlines()))
          union_records = list(map(json.loads, union.splitlines()))
          original_paths = {
              r["path_b64"]: r
              for r in map(json.loads, (root / "source-paths.jsonl").read_bytes().splitlines())
          }
          arches = lock["inventories"]["arch_directories"]
          assert report["status"] == "PARTIAL_LEXICAL_ARCH_ROOT_REACHABILITY_NOT_EVALUATED"
          assert not report["inventory_complete"] and not report["full_rewrite_complete"]
          assert report["counts"]["architecture_profiles"] == len(arches) == 21
          assert [p["arch_profile"] for p in report["profiles"]] == arches
          assert report["linux_commit"] == lock["linux"]["commit"]
          assert report["membership_sha256"] == hashlib.sha256(raw).hexdigest()
          assert report["union_sha256"] == hashlib.sha256(union).hexdigest()
          assert report["counts"]["membership_rows"] == len(records)
          assert report["counts"]["union_reachable_files"] == len(union_records)
          by_arch = {a: set() for a in arches}
          by_file = {}
          for rec in records:
              name = rec["arch_profile"]
              p = rec["path_b64"]
              assert name in by_arch and p in original_paths
              assert rec["oid"] == original_paths[p]["oid"]
              assert original_paths[p]["mode"] in ("100644", "100755")
              assert p not in by_arch[name] and rec["depth"] >= 0
              by_arch[name].add(p)
              by_file.setdefault(p, []).append(name)
          for prof in report["profiles"]:
              assert prof["reachable_files"] == len(by_arch[prof["arch_profile"]])
              assert prof["lexical_edges"] == 1935
              assert base64.b64encode(b"Kconfig").decode() in by_arch[prof["arch_profile"]]
          assert all(r["arch_profiles"] == by_file.pop(r["path_b64"]) and
                     r["oid"] == original_paths[r["path_b64"]]["oid"]
                     for r in union_records)
          assert not by_file
          assert report["counts"]["intersection_reachable_files"] == len(
              set.intersection(*by_arch.values()))
          assert report["source_paths_sha256"] == hashlib.sha256(
              (root / "source-paths.jsonl").read_bytes()).hexdigest()
          assert report["source_literal_sha256"] == hashlib.sha256(
              (root / "kconfig-literal-targets.jsonl").read_bytes()).hexdigest()
          print("KCONFIG_ARCH_PROFILE_MATRIX:", report["counts"])
          print("KCONFIG_ACTIVE_DEPENDENCY_GRAPH: HOLD")
          print("FULL_LINUX_REWRITE: HOLD")
          PY

