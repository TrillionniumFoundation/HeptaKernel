name: Pinned Linux source inventory

on:
  pull_request:
    paths:
      - 'tools/linux_inventory.py'
      - 'tools/linux_uapi_tags.py'
      - 'tools/linux_kconfig_relations.py'
      - 'tools/linux_kconfig_scoped.py'
      - 'tests/test_linux_uapi_tags.py'
      - 'tests/test_linux_kconfig_relations.py'
      - 'tests/test_linux_kconfig_scoped.py'
      - 'tests/test_linux_inventory.py'
      - 'tests/test_device_table_spans.py'
      - 'docs/linux-inventory.md'
      - '.github/workflows/linux-inventory.yml'
  push:
    branches: [main]
    paths:
      - 'tools/linux_inventory.py'
      - 'tools/linux_uapi_tags.py'
      - 'tools/linux_kconfig_relations.py'
      - 'tools/linux_kconfig_scoped.py'
      - 'tests/test_linux_uapi_tags.py'
      - 'tests/test_linux_kconfig_relations.py'
      - 'tests/test_linux_kconfig_scoped.py'
      - 'tests/test_linux_inventory.py'
      - 'tests/test_device_table_spans.py'
      - 'docs/linux-inventory.md'
      - '.github/workflows/linux-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recursive-source-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout HeptaKernel candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Test inventory parser against adversarial Git fixtures
        run: |
          python3 -I -B tests/test_linux_inventory.py
          python3 -I -B tests/test_device_table_spans.py
          python3 -I -B tests/test_linux_uapi_tags.py
          python3 -I -B tests/test_linux_kconfig_relations.py
          python3 -I -B tests/test_linux_kconfig_scoped.py

      - name: Checkout exact pinned upstream Linux (not a moving branch)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: gregkh/linux
          ref: 7595a62d45ee1a2297eafa5f2ef5d0a45142d84d
          fetch-depth: 1
          persist-credentials: false
          path: .upstream/linux

      - name: Extract all tracked paths and Kconfig lexical declarations
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .upstream/linux rev-parse HEAD)" = "7595a62d45ee1a2297eafa5f2ef5d0a45142d84d"
          python3 -I -B tools/linux_inventory.py \
            --repo .upstream/linux \
            --lock compatibility/linux-source-lock.json \
            --out build/linux-inventory

      - name: Inventory immutable UAPI C tag mentions (lexical, not ABI closure)
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B tools/linux_uapi_tags.py --repo .upstream/linux --lock compatibility/linux-source-lock.json --out build/linux-inventory
          python3 - <<'PY'
          import base64, hashlib, json, subprocess
          from pathlib import Path
          report = json.loads(Path("build/linux-inventory/uapi-tag-report.json").read_text())
          source = Path("build/linux-inventory/uapi-tag-mentions.jsonl").read_bytes()
          assert hashlib.sha256(source).hexdigest() == report["source_sha256"]
          assert report["records"] == len(source.splitlines()) and report["records"] > 0
          assert not report["inventory_complete"] and not report["full_rewrite_complete"]
          assert report["linux_commit"] == subprocess.check_output(["git","-C",".upstream/linux","rev-parse","HEAD"],text=True).strip()
          assert report["linux_root_tree"] == subprocess.check_output(["git","-C",".upstream/linux","rev-parse","HEAD^{tree}"],text=True).strip()
          assert report["schema"] == "heptakernel.linux-uapi-tag-lexical.v2"
          paths = set()
          blobs = {}
          for raw in source.splitlines():
              row = json.loads(raw)
              path = base64.b64decode(row["path_b64"])
              paths.add(path)
              assert path.endswith(b".h") and b"/uapi/" in b"/" + path
              assert row["tag"] in ("struct","union","enum")
              assert row["byte_at"] >= 0 and row["line"] >= 1
              oid = row["blob_oid"]
              assert len(oid) == 40
              if oid not in blobs:
                  blobs[oid] = subprocess.check_output(
                      ["git", "-C", ".upstream/linux", "cat-file", "blob", oid])
              physical_blob = blobs[oid]
              at = row["byte_at"]
              assert physical_blob[:at].count(b"\n") + 1 == row["line"]
              for start, span, token in (
                  (at, row["raw_span"], row["tag"].encode("ascii")),
                  (row["name_byte_at"], row["name_raw_span"],
                   base64.b64decode(row["name_b64"]) if row["name_b64"] else None)):
                  if token is None:
                      assert start is None and span is None
                      continue
                  assert isinstance(start, int) and isinstance(span, int)
                  assert 0 <= start < len(physical_blob) and span >= len(token)
                  assert start + span <= len(physical_blob)
                  physical_token = physical_blob[start:start + span]
                  assert physical_token.replace(b"\\\r\n", b"").replace(
                      b"\\\n", b"") == token
          assert paths
          print("UAPI_TAG_PHYSICAL_ORIGIN: PASS", report["records"], len(blobs))
          print("UAPI_TAG_LEXICAL_MANIFEST: PASS", report["records"], len(paths))
          print("FULL_LINUX_REWRITE: HOLD")
          PY

      - name: Inventory Kconfig relation lines with independent source-byte readback
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B tools/linux_kconfig_relations.py --repo .upstream/linux --lock compatibility/linux-source-lock.json --out build/linux-inventory
          python3 - <<'PY'
          import base64, hashlib, json, subprocess
          from pathlib import Path
          root = Path("build/linux-inventory")
          report = json.loads((root / "kconfig-relation-report.json").read_text())
          source = (root / "kconfig-relation-lines.jsonl").read_bytes()
          commit = json.loads(Path("compatibility/linux-source-lock.json").read_text())["linux"]["commit"]
          run = lambda *a: subprocess.check_output(["git", "-C", ".upstream/linux", *a])
          assert report["linux_commit"] == run("rev-parse", "HEAD").strip().decode() == commit
          assert report["linux_root_tree"] == run("rev-parse", "HEAD^{tree}").strip().decode()
          assert hashlib.sha256(source).hexdigest() == report["source_sha256"]
          assert report["status"] == "PARTIAL_LEXICAL_RELATIONS_NOT_RESOLVED_GRAPH"
          assert report["inventory_complete"] is False and report["full_rewrite_complete"] is False
          rows = [json.loads(line) for line in source.splitlines()]
          assert len(rows) == report["counts"]["relation_line_candidates"] > 0
          paths = [json.loads(line) for line in (root / "source-paths.jsonl").read_bytes().splitlines()]
          ref = []
          counter = {"kconfig_paths": 0, "unreadable_kconfig_paths": 0,
                     "scanned_kconfig_paths": 0}
          single = {b"select", b"imply", b"default", b"range", b"prompt",
                    b"def_bool", b"def_tristate"}
          for item in paths:
              name = base64.b64decode(item["path_b64"])
              leaf = name.split(b"/")[-1]
              if leaf != b"Kconfig" and not leaf.startswith(b"Kconfig."):
                  continue
              counter["kconfig_paths"] += 1
              if item["mode"] not in ("100644", "100755") or item["type"] != "blob":
                  counter["unreadable_kconfig_paths"] += 1
                  continue
              counter["scanned_kconfig_paths"] += 1
              blob = run("cat-file", "blob", item["oid"])
              assert len(blob) == item["size"]
              offset = 0
              for number, raw in enumerate(blob.split(b"\n"), 1):
                  trimmed = raw.lstrip(b" \t")
                  words = trimmed.split(None, 2)
                  kind, operand = None, None
                  if len(words) >= 3 and words[0:2] == [b"depends", b"on"]:
                      kind, operand = b"depends_on", words[2]
                  elif len(words) >= 3 and words[0:2] == [b"visible", b"if"]:
                      kind, operand = b"visible_if", words[2]
                  elif len(words) >= 2 and words[0] in single:
                      kind, operand = words[0], trimmed.split(None, 1)[1]
                  if kind is not None and operand is not None and operand[:1] not in (b" ", b"\t", b"\r"):
                      ref.append((name, item["oid"], number,
                                  offset + len(raw) - len(trimmed),
                                  offset + len(raw), kind, raw, operand))
                  offset += len(raw) + 1
          actual = [(base64.b64decode(x["path_b64"]), x["blob_oid"], x["line"],
                     x["byte_at"], x["byte_end"], x["kind"].encode(),
                     base64.b64decode(x["raw_b64"]),
                     base64.b64decode(x["operand_b64"])) for x in rows]
          assert [(a,b,c,d,e,f,g) for a,b,c,d,e,f,g,h in actual] == [
              (a,b,c,d,e,f,g) for a,b,c,d,e,f,g,h in ref]
          assert all(x[7] == y[7] for x,y in zip(actual,ref))
          for key, count in counter.items():
              assert report["counts"].get(key, 0) == count
          print("KCONFIG_RELATION_ORIGINAL_GIT_BYTES: PASS", len(ref))
          print("KCONFIG_SEMANTIC_DEPENDENCY_GRAPH: HOLD")
          PY

      - name: Verify pinned Kconfig property owner candidates and preserve lexical rows
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B tools/linux_kconfig_scoped.py --repo .upstream/linux --lock compatibility/linux-source-lock.json --out build/linux-inventory
          python3 - <<'PY'
          import base64, hashlib, json, re, subprocess
          from pathlib import Path
          root = Path("build/linux-inventory")
          report = json.loads((root / "kconfig-property-scopes-report.json").read_text())
          payload = (root / "kconfig-property-scopes.jsonl").read_bytes()
          old = [json.loads(raw) for raw in (root / "kconfig-relation-lines.jsonl").read_bytes().splitlines()]
          now = [json.loads(raw) for raw in payload.splitlines()]
          commit = json.loads(Path("compatibility/linux-source-lock.json").read_text())["linux"]["commit"]
          git = lambda *xs: subprocess.check_output(["git", "-C", ".upstream/linux", *xs])
          assert report["linux_commit"] == commit == git("rev-parse", "HEAD").strip().decode()
          assert report["linux_root_tree"] == git("rev-parse", "HEAD^{tree}").strip().decode()
          assert hashlib.sha256(payload).hexdigest() == report["source_sha256"]
          assert report["status"] == "PARTIAL_LEXICAL_OWNER_CANDIDATES_NOT_KCONFIG_GRAPH"
          assert not report["inventory_complete"] and not report["full_rewrite_complete"]
          assert len(now) == len(old) == report["counts"]["property_candidates"] > 0
          allowed = {"SCOPED_LEXICAL_CANDIDATE", "HELP_TEXT_LEXICAL_ONLY",
                     "UNBOUND_LEXICAL_CANDIDATE", "UNRESOLVED_CONTINUATION"}
          blobs = {}
          for before, after in zip(old, now):
              assert all(after[key] == value for key, value in before.items()), (before, after)
              assert after["scope_status"] in allowed
              key = after["blob_oid"]
              if key not in blobs:
                  blobs[key] = git("cat-file", "blob", key).split(b"\n")
              lines = blobs[key]
              assert base64.b64decode(after["raw_b64"]) == lines[after["line"] - 1]
              if after["scope_status"] == "SCOPED_LEXICAL_CANDIDATE":
                  decl = after["owner_declaration_line"]
                  assert isinstance(decl, int) and 1 <= decl < after["line"]
                  assert isinstance(after["owner"], str) and after["owner"]
                  statement = lines[decl - 1].lstrip(b" \t")
                  declaration = re.match(rb"(?:config|menuconfig)[ \t]+([A-Za-z_][A-Za-z0-9_]*)\b", statement)
                  assert declaration is not None and declaration.group(1) == after["owner"].encode(), (
                      after["blob_oid"], decl, repr(statement), after["owner"])
              else:
                  assert after["owner"] is None and after["owner_declaration_line"] is None
          assert sum(report["counts"].get(key, 0) for key in allowed) == len(now)
          print("KCONFIG_SCOPED_IMMUTABLE_ROWS:", len(now), report["counts"])
          print("KCONFIG_DEPENDENCY_EVALUATION: HOLD")
          PY

      - name: Independently check source counts, hashes and unclosed Linux scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, subprocess
          from pathlib import Path
          root = Path("build/linux-inventory")
          report = json.loads((root / "report.json").read_text())
          commit = json.loads(Path("compatibility/linux-source-lock.json").read_text())["linux"]["commit"]
          assert report["linux_commit"] == commit
          assert report["linux_root_tree"] == subprocess.check_output([
              "git", "-C", ".upstream/linux", "rev-parse", "HEAD^{tree}"
          ], text=True).strip()
          assert report["status"] == "PARTIAL_SOURCE_INVENTORY_NOT_LINUX_IMPLEMENTATION"
          assert report["inventory_complete"] is False
          assert report["linux_full_rewrite_complete"] is False
          source = (root / report["source_paths_file"]).read_bytes()
          kconfig = (root / report["kconfig_declarations_file"]).read_bytes()
          source_edges = (root / report["kconfig_source_edges_file"]).read_bytes()
          directories = (root / report["directory_objects_file"]).read_bytes()
          uapi = (root / report["uapi_entries_file"]).read_bytes()
          syscall = (root / report["syscall_table_rows_file"]).read_bytes()
          uapi_macros = (root / report["uapi_macro_rows_file"]).read_bytes()
          device_tables = (root / report["module_device_table_mentions_file"]).read_bytes()
          invocation_bytes = (root / report["module_device_table_invocations_file"]).read_bytes()
          assert hashlib.sha256(source).hexdigest() == report["source_paths_sha256"]
          assert hashlib.sha256(kconfig).hexdigest() == report["kconfig_declarations_sha256"]
          assert hashlib.sha256(source_edges).hexdigest() == report["kconfig_source_edges_sha256"]
          assert hashlib.sha256(directories).hexdigest() == report["directory_objects_sha256"]
          assert hashlib.sha256(uapi).hexdigest() == report["uapi_entries_sha256"]
          assert hashlib.sha256(syscall).hexdigest() == report["syscall_table_rows_sha256"]
          assert hashlib.sha256(uapi_macros).hexdigest() == report["uapi_macro_rows_sha256"]
          assert hashlib.sha256(device_tables).hexdigest() == report["module_device_table_mentions_sha256"]
          assert hashlib.sha256(invocation_bytes).hexdigest() == report["module_device_table_invocations_sha256"]
          rows = [json.loads(x) for x in source.splitlines()]
          paths = [base64.b64decode(x["path_b64"]) for x in rows]
          actual = subprocess.check_output([
              "git", "-C", ".upstream/linux", "ls-tree", "--full-tree",
              "-r", "-z", "--name-only", commit
          ]).rstrip(b"\0").split(b"\0")
          assert len(rows) == len(actual) == report["counts"]["tracked_paths"]
          assert set(paths) == set(actual)
          assert paths == sorted(paths)
          assert len(paths) == len(set(paths))
          directory_rows = [json.loads(x) for x in directories.splitlines()]
          uapi_rows = [json.loads(x) for x in uapi.splitlines()]
          ref_tree = subprocess.check_output([
              "git", "-C", ".upstream/linux", "ls-tree",
              "-r", "-t", "-z", "--full-tree", commit
          ])
          ref_directories = {}
          for entry in ref_tree.split(b"\x00"):
              if not entry:
                  continue
              metadata, path = entry.split(b"\t", 1)
              mode, kind, oid = metadata.split()
              if kind == b"tree":
                  assert mode == b"040000"
                  ref_directories[path] = oid.decode("ascii")
          assert {base64.b64decode(x["path_b64"]): x["oid"]
                  for x in directory_rows} == ref_directories
          assert len(directory_rows) == report["counts"]["directory_tree_objects"]
          by_path = {base64.b64decode(x["path_b64"]): x for x in rows}
          # Independent UAPI lexer over each exact immutable upstream blob.
          # Do not import or repeat the extractor regex. All #if branches
          # remain visible as lexical source, not claimed ABI exports.
          actual_macros = [json.loads(x) for x in uapi_macros.splitlines()]
          expected_macros = []
          uapi_headers = 0
          unreadable_headers = 0
          for ref in uapi_rows:
              path = base64.b64decode(ref["path_b64"])
              if not path.endswith(b".h"):
                  continue
              uapi_headers += 1
              if ref["mode"] not in ("100644", "100755"):
                  unreadable_headers += 1
                  continue
              blob = subprocess.check_output([
                  "git", "-C", ".upstream/linux", "cat-file", "blob", ref["oid"]
              ])
              assert len(blob) == ref["size"]
              for number, physical in enumerate(blob.split(b"\n"), 1):
                  stripped = physical.lstrip(b" \t")
                  if not stripped.startswith(b"#"):
                      continue
                  directive = stripped[1:].lstrip(b" \t")
                  if not directive.startswith(b"define"):
                      continue
                  tail = directive[6:]
                  if not tail or tail[0] not in (32, 9):
                      continue
                  identifier = tail.lstrip(b" \t")
                  if not identifier or not (
                      65 <= identifier[0] <= 90 or
                      97 <= identifier[0] <= 122 or identifier[0] == 95
                  ):
                      continue
                  width = 1
                  while width < len(identifier) and (
                      65 <= identifier[width] <= 90 or
                      97 <= identifier[width] <= 122 or
                      48 <= identifier[width] <= 57 or
                      identifier[width] == 95
                  ):
                      width += 1
                  expected_macros.append((
                      path, ref["oid"], number, identifier[:width], physical
                  ))
          observed_macros = [
              (base64.b64decode(x["path_b64"]), x["blob_oid"], x["line"],
               base64.b64decode(x["name_b64"]), base64.b64decode(x["raw_b64"]))
              for x in actual_macros
          ]
          assert observed_macros == expected_macros, (
              "missing/reordered/modified UAPI macro source rows")
          assert len(actual_macros) == report["counts"]["uapi_macro_rows"]
          assert uapi_headers == report["counts"]["uapi_header_files"]
          assert unreadable_headers == report["counts"]["unreadable_uapi_header_files"]
          assert len(uapi_rows) == report["counts"]["uapi_tree_entries"]
          for uapi_record in uapi_rows:
              assert by_path[base64.b64decode(uapi_record["path_b64"])] == uapi_record
          assert report["counts"]["kconfig_declarations"] > 0
          # Independently enumerate every source row from immutable Git blobs.
          ref_tables = [row for row in rows
                        if (base64.b64decode(row["path_b64"]) == b"scripts/syscall.tbl"
                            or (b"/syscalls/" in base64.b64decode(row["path_b64"])
                                and base64.b64decode(row["path_b64"]).endswith(b".tbl")))]
          assert len(ref_tables) == report["counts"]["syscall_table_files"]
          actual_syscalls = [json.loads(x) for x in syscall.splitlines()]
          expected_syscalls = []
          unparsed_syscalls = 0
          for ref in ref_tables:
              path = base64.b64decode(ref["path_b64"])
              if ref["mode"] not in ("100644", "100755"):
                  continue
              blob = subprocess.check_output([
                  "git", "-C", ".upstream/linux", "cat-file", "blob", ref["oid"]
              ])
              assert len(blob) == ref["size"]
              for lineno, raw in enumerate(blob.split(b"\n"), 1):
                  source = raw.partition(b"#")[0].strip()
                  if not source:
                      continue
                  fields = source.split()
                  status = "LEXICAL_ROW" if len(fields) >= 3 else "UNPARSED"
                  unparsed_syscalls += status == "UNPARSED"
                  expected_syscalls.append((
                      path, ref["oid"], lineno, raw, fields, status))
          emitted_syscalls = [
              (base64.b64decode(x["path_b64"]), x["blob_oid"], x["line"],
               base64.b64decode(x["raw_b64"]),
               [base64.b64decode(v) for v in x["columns_b64"]], x["status"])
              for x in actual_syscalls]
          assert emitted_syscalls == expected_syscalls, (
              "missing/reordered/modified syscall table rows")
          assert len(actual_syscalls) == report["counts"]["syscall_table_rows"]
          assert unparsed_syscalls == report["counts"]["syscall_table_unparsed_rows"]
          assert report["counts"]["unreadable_syscall_table_files"] == sum(
              x["mode"] not in ("100644", "100755") for x in ref_tables)
          edges = [json.loads(x) for x in source_edges.splitlines()]
          assert len(edges) == report["counts"]["kconfig_source_edges"]
          source_kinds = ("source", "rsource", "osource", "orsource")
          valid_blob_ids = {p["oid"] for p in rows}
          assert all(e["kind"] in source_kinds and e["line"] >= 1 and
                     e["blob_oid"] in valid_blob_ids and
                     base64.b64decode(e["operand_b64"]) for e in edges)
          assert sum(report["counts"]["kconfig_source_" + kind]
                     for kind in source_kinds) == len(edges)
          # Independent upstream readback, not a replay of the extraction
          # function: re-read every immutable Kconfig blob and reconstruct all
          # four directive rows by whitespace tokenization.
          actual_edges = [
              (base64.b64decode(e["path_b64"]), e["line"], e["kind"].encode("ascii"),
               base64.b64decode(e["operand_b64"]), e["blob_oid"])
              for e in edges
          ]
          expected_edges = []
          for record in rows:
              path = base64.b64decode(record["path_b64"])
              leaf = path.rsplit(b"/", 1)[-1]
              if not (leaf == b"Kconfig" or leaf.startswith(b"Kconfig.")):
                  continue
              if record["mode"] not in ("100644", "100755"):
                  continue
              original = subprocess.check_output([
                  "git", "-C", ".upstream/linux", "cat-file", "blob", record["oid"]
              ])
              assert len(original) == record["size"]
              for number, line in enumerate(original.splitlines(), 1):
                  tokens = line.lstrip(b" \t").split(None, 1)
                  if len(tokens) != 2 or tokens[0] not in (
                          b"source", b"rsource", b"osource", b"orsource"):
                      continue
                  expected_edges.append((path, number, tokens[0],
                                         tokens[1].strip(b" \t"), record["oid"]))
          assert actual_edges == expected_edges, (
              "incomplete or reordered lexical Kconfig source-edge inventory")
          print("FULL_GIT_TREE_LOSSLESS_INVENTORY: PASS", len(rows))
          print("KCONFIG_DECLARATION_RECORDS:", report["counts"]["kconfig_declarations"])
          print("KCONFIG_SOURCE_EDGES:", report["counts"]["kconfig_source_edges"])
          print("SYSCALL_TABLE_ROWS:", len(actual_syscalls))
          # Independent whole-commit literal search locates candidate blobs;
          # independently inspect their original Git objects line by line.
          # Comments and inactive branches deliberately remain lexical only.
          import re
          listing = subprocess.run([
              "git", "-C", ".upstream/linux", "grep", "-l", "-z", "-I",
              "-F", "MODULE_DEVICE_TABLE", commit, "--", "*.c", "*.h", "*.rs"
          ], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          assert listing.returncode in (0, 1), listing.stderr
          expected_device = []
          for tagged in filter(None, listing.stdout.split(b"\x00")):
              assert tagged.startswith(commit.encode() + b":")
              path = tagged[41:]
              ref = by_path[path]
              assert ref["mode"] in ("100644", "100755")
              blob = subprocess.check_output([
                  "git", "-C", ".upstream/linux", "cat-file", "blob", ref["oid"]
              ])
              assert len(blob) == ref["size"]
              for number, line in enumerate(blob.split(b"\n"), 1):
                  if not re.search(rb"MODULE_DEVICE_TABLE[ \t]*\(", line):
                      continue
                  match = re.search(
                      rb"MODULE_DEVICE_TABLE[ \t]*\([ \t]*([A-Za-z_][A-Za-z_0-9]*)"
                      rb"[ \t]*,[ \t]*([A-Za-z_][A-Za-z_0-9]*)[ \t]*\)",
                      line)
                  expected_device.append((path, ref["oid"], number, line,
                      "LEXICAL_ARGUMENTS" if match else "UNPARSED",
                      match.group(1) if match else None,
                      match.group(2) if match else None))
          actual_device = [(base64.b64decode(x["path_b64"]), x["blob_oid"],
                            x["line"], base64.b64decode(x["raw_b64"]), x["status"],
                            base64.b64decode(x["bus_b64"]) if x["bus_b64"] else None,
                            base64.b64decode(x["symbol_b64"]) if x["symbol_b64"] else None)
                           for x in map(json.loads, device_tables.splitlines())]
          assert actual_device == sorted(expected_device, key=lambda x: (x[0], x[2])), (
              "missing/reordered/modified pinned driver macro source rows")
          assert report["counts"]["module_device_table_mentions"] == len(actual_device)
          assert report["counts"]["module_device_table_unparsed"] == sum(
              x[4] == "UNPARSED" for x in actual_device)
          # Independently reconstruct each bounded call from the original Git
          # blobs. This deliberately does not import the extractor's regex.
          expected_spans = []
          word = b"MODULE_DEVICE_TABLE"
          allowed_space = b" \t\r\n"
          import re
          for tagged in filter(None, listing.stdout.split(b"\x00")):
              assert tagged.startswith(commit.encode("ascii") + b":")
              path = tagged[41:]
              ref = by_path[path]
              blob = subprocess.check_output([
                  "git", "-C", ".upstream/linux", "cat-file", "blob", ref["oid"]
              ])
              assert len(blob) == ref["size"]
              position = 0
              while True:
                  start = blob.find(word, position)
                  if start < 0:
                      break
                  position = start + len(word)
                  open_at = position
                  while open_at < len(blob) and blob[open_at] in allowed_space:
                      open_at += 1
                  if open_at >= len(blob) or blob[open_at] != 40:
                      continue
                  scan_end = min(len(blob), open_at + 1 + 4096)
                  close = blob.find(b")", open_at + 1, scan_end)
                  end = close + 1 if close >= 0 else scan_end
                  raw = blob[start:end]
                  tokens = raw[open_at - start + 1:-1].split(b",") if close >= 0 else []
                  identifiers = [token.strip(allowed_space) for token in tokens]
                  is_ident = lambda token: re.fullmatch(
                      rb"[A-Za-z_][A-Za-z_0-9]*", token) is not None
                  parseable = len(identifiers) == 2 and all(
                      is_ident(token) for token in identifiers)
                  status = ("TRUNCATED" if close < 0 else
                            "LEXICAL_ARGUMENTS" if parseable else "UNPARSED")
                  expected_spans.append((
                      path, ref["oid"], start, end,
                      blob.count(b"\n", 0, start) + 1,
                      blob.count(b"\n", 0, end - 1) + 1,
                      raw, status,
                      identifiers[0] if parseable else None,
                      identifiers[1] if parseable else None,
                  ))
          expected_spans.sort(key=lambda x: (x[0], x[2]))
          actual_spans = []
          for row in map(json.loads, invocation_bytes.splitlines()):
              actual_spans.append((
                  base64.b64decode(row["path_b64"]), row["blob_oid"],
                  row["start_byte"], row["end_byte"],
                  row["start_line"], row["end_line"],
                  base64.b64decode(row["raw_b64"]), row["status"],
                  base64.b64decode(row["bus_b64"]) if row["bus_b64"] else None,
                  base64.b64decode(row["symbol_b64"]) if row["symbol_b64"] else None,
              ))
          assert actual_spans == expected_spans, (
              "missing, forged or reordered pinned multiline device table spans")
          assert len(actual_spans) == report["counts"]["module_device_table_invocations"]
          assert sum(row[5] > row[4] for row in actual_spans) == (
              report["counts"]["module_device_table_multiline"])
          assert sum(row[7] != "LEXICAL_ARGUMENTS" for row in actual_spans) == (
              report["counts"]["module_device_table_invocations_unparsed"])
          print("MODULE_DEVICE_TABLE_POSITION_BOUND_SPANS:", len(actual_spans))
          print("MODULE_DEVICE_TABLE_LEXICAL_ROWS:", len(actual_device))
          print("UAPI_MACRO_SOURCE_ROWS:", len(actual_macros))
          print("UNPARSED_SYSCALL_ROWS:", unparsed_syscalls)
          print("FULL_LINUX_REWRITE: HOLD")
          PY
          set +e
          python3 tools/check_closure.py > build/linux-inventory/closure-state.json
          result=$?
          set -e
          test "$result" -eq 2
          cat build/linux-inventory/closure-state.json

      - name: Retain pinned, replayable inventory as an artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pinned-linux-source-inventory-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            build/linux-inventory/source-paths.jsonl
            build/linux-inventory/kconfig-declarations.jsonl
            build/linux-inventory/kconfig-source-edges.jsonl
            build/linux-inventory/kconfig-relation-lines.jsonl
            build/linux-inventory/kconfig-relation-report.json
            build/linux-inventory/kconfig-property-scopes.jsonl
            build/linux-inventory/kconfig-property-scopes-report.json
            build/linux-inventory/directory-objects.jsonl
            build/linux-inventory/uapi-paths.jsonl
            build/linux-inventory/uapi-macro-rows.jsonl
            build/linux-inventory/uapi-tag-mentions.jsonl
            build/linux-inventory/uapi-tag-report.json
            build/linux-inventory/syscall-table-rows.jsonl
            build/linux-inventory/module-device-table-mentions.jsonl
            build/linux-inventory/module-device-table-invocations.jsonl
