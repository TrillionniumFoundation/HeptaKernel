name: Experimental HIA xAPIC one-shot timer delivery and EOI (not Linux acceptance)
on:
  push:
    branches: ['automation/x86-apic-one-shot-timer-*']
  pull_request:
    paths:
      - 'src/x86_apic_one_shot_timer.hepta'
      - 'tests/fixtures/x86_apic_one_shot_timer.*'
      - 'tests/test_x86_apic_one_shot_timer_qemu.py'
      - '.github/workflows/x86-apic-one-shot-timer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experimental-apic-one-shot-timer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: TrillionniumFoundation/Hepta
          ref: fed7aac38b86c2dfb4ed03aa9491fa93b7565dad
          persist-credentials: false
          path: .upstream/hepta-experimental
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y binutils gcc qemu-system-x86
      - name: Independently rebuild the exact experimental selfhost compiler
        run: |
          test "$(git -C .upstream/hepta-experimental rev-parse HEAD)" = fed7aac38b86c2dfb4ed03aa9491fa93b7565dad
          python -B .upstream/hepta-experimental/tools/qualify_hia_kernel_selfhost_invlpg.py --output "$RUNNER_TEMP/kernel-experimental"
      - name: Execute HIA xAPIC one-shot timer and EOI against independent hardware observer
        env:
          LC_ALL: C
        run: python -B tests/test_x86_apic_one_shot_timer_qemu.py --compiler-dir "$RUNNER_TEMP/kernel-experimental" --output "$RUNNER_TEMP/apic-one-shot-timer"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apic-one-shot-timer-${{ github.sha }}
          path: |
            ${{ runner.temp }}/kernel-experimental/report.json
            ${{ runner.temp }}/apic-one-shot-timer/
          if-no-files-found: warn
          retention-days: 7
