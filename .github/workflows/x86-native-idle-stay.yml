name: Experimental native idle stay (not Linux acceptance)
on:
  push:
    branches: ['automation/x86-native-idle-stay-*']
  pull_request:
    paths:
      - 'src/x86_native_idle_select.hepta'
      - 'src/x86_native_running_block.hepta'
      - 'src/x86_native_frame_rollback_guard.hepta'
      - 'src/x86_native_ready_compensation.hepta'
      - 'src/x86_native_bounded_owner.hepta'
      - 'src/x86_native_bounded_slot_dispatch.hepta'
      - 'src/x86_native_three_task_owner.hepta'
      - 'src/x86_native_ready_exchange.hepta'
      - 'src/x86_native_versioned_ready_state.hepta'
      - 'src/x86_native_owner_dispatch.hepta'
      - 'src/x86_native_irq_entry.hepta'
      - 'src/x86_native_kernel_frame.hepta'
      - 'src/x86_two_task_preemption.hepta'
      - 'tests/fixtures/x86_native_idle_stay.S'
      - 'tests/fixtures/x86_native_idle_select.S'
      - 'tests/fixtures/x86_native_running_block.S'
      - 'tests/fixtures/x86_apic_one_shot_timer.ld'
      - 'tests/test_x86_native_idle_stay.py'
      - 'tests/test_x86_native_idle_select.py'
      - '.github/workflows/x86-native-idle-stay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-idle-stay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: TrillionniumFoundation/Hepta
          ref: 25c165ba7c80e3e1124acd4efb083c637fbb275a
          persist-credentials: false
          path: .upstream/hepta-experimental
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y binutils gcc qemu-system-x86
      - name: Rebuild exact experimental native compiler
        run: |
          test "$(git -C .upstream/hepta-experimental rev-parse HEAD)" = 25c165ba7c80e3e1124acd4efb083c637fbb275a
          python -B .upstream/hepta-experimental/tools/qualify_hia_kernel_selfhost_invlpg.py --output "$RUNNER_TEMP/kernel-experimental"
      - name: Actual no-wake idle IRQ return and independent hardware oracle
        run: python -B tests/test_x86_native_idle_stay.py --compiler-dir "$RUNNER_TEMP/kernel-experimental" --output "$RUNNER_TEMP/idle-stay"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idle-stay-${{ github.sha }}
          path: |
            ${{ runner.temp }}/kernel-experimental/report.json
            ${{ runner.temp }}/idle-stay/
          retention-days: 7
