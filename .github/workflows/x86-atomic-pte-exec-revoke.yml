name: Experimental HIA atomic NX revoke (not Linux acceptance)
on:
  push:
    branches: ['automation/x86-atomic-pte-exec-revoke-*']
  pull_request:
    paths:
      - 'src/x86_pt_atomic_exec_revoke.hepta'
      - 'tests/fixtures/x86_pt_atomic_exec_revoke.*'
      - 'tests/test_x86_pt_atomic_exec_revoke_qemu.py'
      - '.github/workflows/x86-atomic-pte-exec-revoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experimental-pte:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: TrillionniumFoundation/Hepta
          ref: afa29e97aba26351d366f9ecded027e127e77427
          persist-credentials: false
          path: .upstream/hepta-experimental
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y binutils gcc qemu-system-x86
      - name: Rebuild exact experimental compiler independently
        run: |
          test "$(git -C .upstream/hepta-experimental rev-parse HEAD)" = afa29e97aba26351d366f9ecded027e127e77427
          python -B .upstream/hepta-experimental/tools/qualify_hia_kernel_selfhost_invlpg.py --output "$RUNNER_TEMP/kernel-experimental"
      - name: Execute native atomic NX revoke and precise instruction-fetch protection fault
        run: python -B tests/test_x86_pt_atomic_exec_revoke_qemu.py --compiler-dir "$RUNNER_TEMP/kernel-experimental" --output "$RUNNER_TEMP/atomic-nx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atomic-nx-experiment-${{ github.sha }}
          path: |
            ${{ runner.temp }}/kernel-experimental/report.json
            ${{ runner.temp }}/atomic-nx/
          if-no-files-found: warn
          retention-days: 7
