name: HIA kernel foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out HeptaKernel
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install the assembler, linker and QEMU test runner
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential binutils qemu-system-x86

      - name: Check out the pinned HIA toolchain
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: TrillionniumFoundation/Hepta
          ref: f33d8da316de8fdf27b504371f1a5310997ff548
          path: .toolchain/hepta
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            hepta
            tools
            examples/hia_bootstrap
            docs

      - name: Reproduce the native HIA compiler
        shell: bash
        run: |
          python3 -I -S -B tools/bootstrap_hia.py \
            --root .toolchain/hepta --output .toolchain/compiler

      - name: Independently verify the edited HIA Core source
        shell: bash
        run: |
          PYTHONPATH=.toolchain/hepta python3 - <<'PY'
          from pathlib import Path
          from hepta.hia_agent_assembly import assemble_program
          for source in ("src/elf64_page_plan.hepta", "tests/negative/elf64_page_plan_noop.hepta", "src/elf64_page_fill.hepta", "tests/negative/elf64_page_fill_noop.hepta", "src/elf64_load_segments.hepta", "tests/negative/elf64_load_allow_all.hepta", "src/elf64_exec_admit.hepta", "tests/negative/elf64_exec_allow_all.hepta", "src/pmm_bitmap_integrity.hepta", "tests/negative/pmm_bitmap_noop.hepta", "src/cow_frame_binding.hepta", "tests/negative/cow_frame_binding_noop.hepta", "src/cow_abort_pte_guarded.hepta", "tests/negative/cow_abort_pte_guarded_noop.hepta", "src/cow_abort.hepta", "tests/negative/cow_abort_noop.hepta", "src/cow_pte_swap.hepta", "tests/negative/cow_pte_swap_noop.hepta", "src/cow_split.hepta", "tests/negative/cow_split_noop.hepta", "src/cow_refcount.hepta", "tests/negative/cow_refcount_noop.hepta", "src/page_copy.hepta", "tests/negative/page_copy_noop.hepta", "src/page_zero.hepta", "tests/negative/page_zero_allow_all.hepta", "src/x86_cr3_root.hepta", "tests/negative/x86_cr3_root_allow_all.hepta", "src/x86_pt_nx_protect.hepta", "tests/negative/x86_pt_nx_protect_allow_all.hepta", "src/x86_pt_write_protect.hepta", "tests/negative/x86_pt_write_protect_allow_all.hepta", "src/x86_pt_user_revoke.hepta", "tests/negative/x86_pt_user_revoke_allow_all.hepta", "src/x86_pt_revoke.hepta", "tests/negative/x86_pt_revoke_allow_all.hepta", "src/x86_access_gate.hepta", "tests/negative/x86_access_allow_all.hepta", "src/x86_walk4_physical.hepta", "src/x86_walk4_auto.hepta", "src/x86_walk4_huge.hepta", "tests/negative/walk4_huge_allow_all.hepta", "src/x86_walk4_indexed.hepta", "tests/negative/walk4_indexed_allow_all.hepta", "src/x86_walk4_entries.hepta", "tests/negative/walk4_allow_all.hepta", "src/x86_cr3_gate.hepta", "tests/negative/cr3_allow_all.hepta", "src/x86_upper_user_gate.hepta", "src/kernel.hepta", "src/e820_region.hepta", "src/arena_router.hepta", "src/owner_binding.hepta", "src/reservation_gate.hepta", "src/x86_pte_leaf.hepta", "src/x86_pt_commit.hepta", "src/x86_pde_2m.hepta", "src/x86_tlb_plan.hepta", "tests/negative/x86_tlb_plan_allow_all.hepta", "src/x86_pdpt_1g.hepta", "src/x86_pf_gate.hepta", "src/x86_idt_gate.hepta", "src/x86_user_gdt.hepta", "src/x86_tss_gdt.hepta", "src/x86_tss_state.hepta", "tests/negative/e820_allow_all.hepta"):
              checked = assemble_program(Path(source).read_bytes())
              print("Independent HIA Core syntax/semantics verification: PASS", source)
              print("Verified functions:", len(checked.as_dict()["functions"]))
          PY

      - name: Build the HIA object and boot image
        shell: bash
        run: |
          make HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Check native behavior and exact HIA object bytes
        shell: bash
        run: |
          make test-native HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Check actual inaccessible and read-only memory boundaries
        shell: bash
        run: |
          make test-guard-pages HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify HIA native 4KiB page copy, read-only source and dishonest control
        shell: bash
        run: |
          make test-page-copy HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify genuine native HIA COW PTE switch and malicious control
        shell: bash
        run: |
          make test-cow-pte-swap HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify native HIA shared-page detach, full copy and count ownership transitions
        shell: bash
        run: |
          make test-cow-split HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify genuine HIA ELF selected PT_LOAD to page-fill plan and independent two-component oracle
        shell: bash
        run: |
          make test-elf64-page-plan HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify HIA ELF file-backed and BSS page fill against independent oracle
        shell: bash
        run: |
          make test-elf64-page-fill HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify native HIA whole-ELF layout, PT_LOAD plans and physical page fill with overlap/liar controls
        shell: bash
        run: |
          make test-elf64-page-plan-hw HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify original HIA ELF file/BSS fill on live QEMU PMM pages and negative controls
        shell: bash
        run: |
          make test-elf64-page-hw HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Validate native HIA ELF64 PT_LOAD spans, executable entry and dishonest control
        shell: bash
        run: |
          make test-elf64-load-segments HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify HIA-native ELF64 admission and adversarial header controls
        shell: bash
        run: |
          make test-elf64-exec-admit HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Validate native HIA entire PMM bitmap, free count and dishonest HIA
        shell: bash
        run: |
          make test-pmm-bitmap-integrity HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify live native HIA complete PMM bitmap and independent QEMU negative controls
        shell: bash
        run: |
          make test-pmm-bitmap-hw HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify native HIA live-PMM and COW PTE frame binding, including malicious control
        shell: bash
        run: |
          make test-cow-frame-binding HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify native HIA COW frame binding against real QEMU PMM and active PTE
        shell: bash
        run: |
          make test-cow-frame-binding-hw HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify native HIA COW abort guarded by a live PTE with oracle and malicious control
        run: |
          make test-cow-abort-pte-guarded HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"
      - name: Verify native HIA COW abort zeroization, counters and split round-trip
        shell: bash
        run: |
          make test-cow-abort HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify genuine native HIA COW split on real guest RAM and independent controls
        shell: bash
        run: |
          make test-cow-split-hw HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify single-CPU HIA COW fault, PTE switch and live-PTE-guarded abort controls
        shell: bash
        run: |
          make test-cow-integrated-hw HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify native HIA bounded COW reference-count transition and dishonest control
        shell: bash
        run: |
          make test-cow-refcount HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify real QEMU native HIA COW counts with malicious and stale-state controls
        shell: bash
        run: |
          make test-cow-refcount-hw HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify native HIA full-page zeroing, OS guard pages and dishonest control
        shell: bash
        run: |
          make test-page-zero HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify native HIA E820 region admission and unsafe negative control
        shell: bash
        run: |
          make test-memory-map HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Test native HIA multi-arena routing and dishonest HIA control
        shell: bash
        run: |
          make test-arenas HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Validate native HIA PMM ownership binding and malicious control
        shell: bash
        run: |
          make test-owner-binding HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify HIA reservation exclusion and dishonest native control
        shell: bash
        run: |
          make test-reservations HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Test native HIA x86 PTE permissions, W^X and dishonest control
        shell: bash
        run: |
          make test-x86-pte HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify native HIA PTE commit with guarded oracle and dishonesty negative control
        shell: bash
        run: |
          make test-x86-pt-commit HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify four-level HIA 4KiB supplied-entry policy and dishonest control
        shell: bash
        run: |
          make test-x86-walk4 HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Independently check native HIA huge-page translation and dishonest control
        shell: bash
        run: |
          make test-x86-walk4-huge HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify native HIA table indexing, linked snapshots, and dishonest control
        shell: bash
        run: |
          make test-x86-walk4-indexed HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify HIA native automatic 4KiB/2MiB/1GiB indexed translation
        shell: bash
        run: |
          make test-x86-walk4-auto HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Validate native HIA 4KiB PTE revocation and malicious control
        shell: bash
        run: |
          make test-x86-pt-revoke HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify native HIA execute-disable downgrade and malicious control
        shell: bash
        run: |
          make test-x86-pt-nx-protect HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify native HIA page write-protection downgrade and malicious control
        shell: bash
        run: |
          make test-x86-pt-write-protect HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Validate native HIA user-to-supervisor PTE downgrade and dishonest native control
        shell: bash
        run: |
          make test-x86-pt-user-revoke HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Refuse crossed, forged, or source-mismatched HIA PTE downgrade evidence
        shell: bash
        run: |
          python3 tests/test_pt_downgrade_report_isolation.py

      - name: Check exact-old dominated single-byte HIA PTE permission stores and mutations
        shell: bash
        run: |
          python3 -B -m unittest tests.test_pt_downgrade_single_byte -v

      - name: Verify HIA native x86 access permission admission and malicious grant control
        shell: bash
        run: |
          make test-x86-access-gate HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Validate genuine native HIA PML4 root snapshot and malicious control
        shell: bash
        run: |
          make test-x86-cr3-root HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify real QEMU CR3 root HIA scan and forged snapshot controls
        shell: bash
        run: |
          make test-cr3-root-hw HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify native HIA CR3 state profile and dishonest all-accept control
        shell: bash
        run: |
          make test-x86-cr3-gate HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify native HIA upper-level U/S gate and dishonest control
        shell: bash
        run: |
          make test-x86-upper-user HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify HIA CR3-rooted physical window walk and dishonest control
        shell: bash
        run: |
          make test-x86-walk4-physical HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify native HIA 2MiB huge PDE writes and dishonest control
        shell: bash
        run: |
          make test-x86-pde-2m HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify actual native HIA IRQ PTE TLB plan admission and malicious control
        shell: bash
        run: |
          make test-x86-tlb-plan HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify native HIA 1GiB PDPTE writes and dishonest control
        shell: bash
        run: |
          make test-x86-pdpt-1g HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify HIA native page fault classification and dishonest control
        shell: bash
        run: |
          make test-x86-pf-gate HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify native HIA IDT descriptor installation and malicious control
        shell: bash
        run: |
          make test-x86-idt HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify native HIA CPL3 user GDT descriptors and dishonest control
        shell: bash
        run: |
          make test-x86-user-gdt HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify native HIA TSS GDT descriptor encoding and dishonest control
        shell: bash
        run: |
          make test-x86-tss-gdt HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Verify native HIA TSS RSP0/IST1 state and malicious control
        shell: bash
        run: |
          make test-x86-tss-state HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Independently test full Linux inventory parser and refusal controls
        run: make test-linux-inventory

      - name: Boot two positive machines and two negative kernels
        shell: bash
        run: |
          make test-boot HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Bind source, native object and both boot containers
        shell: bash
        run: |
          make record-build HEPTA_COMPILER="$GITHUB_WORKSPACE/.toolchain/compiler/native-compiler"

      - name: Record separate full-target acceptance state
        shell: bash
        run: |
          python3 tests/test_closure.py
          set +e
          python3 tools/check_closure.py > build/closure-report.json
          result=$?
          set -e
          cat build/closure-report.json
          if [ "$result" -ne 0 ] && [ "$result" -ne 2 ]; then exit "$result"; fi
          if [ "$result" -eq 2 ]; then
            echo 'Full Linux rewrite remains HOLD. This job validates the foundation only.'
          fi

      - name: Retain bootstrap and execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: heptakernel-foundation-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: |
            .toolchain/compiler/bootstrap-report.json
            .toolchain/compiler/B0.receipt.json
